<p class="font-body-md text-body-md text-secondary-fixed-dim text-center mb-8 w-full" dir="rtl">اكتشف، اطبخ، تعلّم، وشارك عالم الطعام.</p>
<form class="w-full flex flex-col gap-4">
<div>
<label class="sr-only" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-tertiary-container text-[20px]">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-[#1e293b]/50 border border-outline-variant/20 focus:border-primary-container focus:ring-1 focus:ring-primary-container rounded-lg font-body-md text-inverse-on-surface transition-all placeholder:text-tertiary-container outline-none" id="email" placeholder="Email address" type="email"/>
</div>
</div>
<div>
<label class="sr-only" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-tertiary-container text-[20px]">lock</span>
<input class="w-full h-14 pl-12 pr-4 bg-[#1e293b]/50 border border-outline-variant/20 focus:border-primary-container focus:ring-1 focus:ring-primary-container rounded-lg font-body-md text-inverse-on-surface transition-all placeholder:text-tertiary-container outline-none" id="password" placeholder="Password" type="password"/>
</div>
<div class="flex justify-end mt-2">
<a class="font-label-sm text-label-sm text-primary-container hover:text-primary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
</div>
<button class="w-full h-14 bg-primary-container hover:bg-[#d6721d] text-white font-label-md text-label-md rounded-lg shadow-[0_4px_20px_rgba(230,126,34,0.25)] hover:shadow-[0_6px_25px_rgba(230,126,34,0.35)] hover:-translate-y-[1px] transition-all flex items-center justify-center mt-2" type="submit">

                </button>
</form>
<div class="w-full flex items-center gap-4 my-6">
<div class="h-px bg-outline-variant/20 flex-1"></div>
<span class="font-label-sm text-label-sm text-tertiary-container">or continue with</span>
<div class="h-px bg-outline-variant/20 flex-1"></div>
</div>

<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">file_download</span>

<span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">explore</span>

</div>
